name: Mobile foundation checks
# Push runs only on the integration branches; a PR branch is checked once, by its pull_request run.
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request supersedes the run in flight; integration-branch runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/check-foundation.mjs
      - name: User-visible text lives in string resources
        run: node scripts/check-hardcoded-strings.mjs
      - run: node --test scripts/*.test.mjs
      - name: Foundation drift
        run: node scripts/check-foundation-drift.mjs
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Pinned gitleaks binary (version + sha256) rather than a floating action tag, matching the
      # repo's no-surprises posture. --redact keeps any match out of the logs.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.0
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported os: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          case "${os}_${arch}" in
            linux_x64) sha=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e ;;
            linux_arm64) sha=b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f ;;
            darwin_x64) sha=ca221d012d247080c2f6f61f4b7a83bffa2453806b0c195c795bbe9a8c775ed5 ;;
            darwin_arm64) sha=b251ab2bcd4cd8ba9e56ff37698c033ebf38582b477d21ebd86586d927cf87e7 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | shasum -a 256 -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan full git history for secrets
        run: ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
      - name: Verify secret exceptions stay narrow
        run: GITLEAKS_BINARY=./gitleaks node --test scripts/check-secrets-config.test.mjs
  android:
    # Boots an x86_64 emulator that needs Linux KVM (`/dev/kvm`), which the
    # ubuntu-24.04 hosted runner provides.
    runs-on: ubuntu-24.04
    # The emulator suite takes about 19 minutes on the hosted runner; leave headroom so a slow boot
    # is not mistaken for a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:lintRelease -PdadLoadTests --warning-mode all
      - name: Release APK carries no debug stubs
        run: scripts/check-release-apk.sh
      - name: Test Compose journeys and Keystore on Android
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/dad-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name dad-foundation --path "$ANDROID_AVD_HOME/dad-foundation.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx dad-foundation
          "$ANDROID_HOME/emulator/emulator" -avd dad-foundation -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          if ! timeout 120 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          READY=false
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then READY=true; break; fi
            sleep 2
          done
          if [ "$READY" != true ]; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          adb shell input keyevent 82
          # The journeys deliberately exercise controls above the software keyboard.
          adb shell settings put secure show_ime_with_hard_keyboard 1
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$scale" 0; done
          ./gradlew :app:connectedDebugAndroidTest
      - name: Name failing instrumentation tests
        if: always()
        run: |
          shopt -s nullglob
          for f in app/build/outputs/androidTest-results/connected/debug/TEST-*.xml app/build/outputs/androidTest-results/connected/*/TEST-*.xml; do
            awk -v file="$f" '/<testcase /{name=$0} /<failure|<error/{print "FAILED: " name " (" file ")"}' "$f"
          done
          true
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidtest-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
